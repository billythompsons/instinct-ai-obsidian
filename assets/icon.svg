    <line x1="196" y1="298" x2="233" y2="264"/>
    <line x1="316" y1="298" x2="279" y2="264"/>
    <line x1="256" y1="152" x2="256" y2="192"/>
  </g>

  <!-- linked note nodes -->
  <g fill="#0b1220" stroke="#f59e0b" stroke-width="6">
    <circle cx="196" cy="300" r="11"/>
    <circle cx="316" cy="300" r="11"/>
    <circle cx="256" cy="150" r="9"/>
